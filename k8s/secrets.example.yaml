apiVersion: v1
kind: Secret
metadata:
  name: portfolio-contact-secrets
  namespace: portfolio
type: Opaque
stringData:
  mongodb-root-username: portfolio_admin
  mongodb-root-password: change-me-root-password
  mongodb-db: portfolio
  admin-api-token: replace-with-long-random-token
  turnstile-secret-key: optional-turnstile-secret
  rate-limit-window-ms: "900000"
  rate-limit-max-requests: "5"
